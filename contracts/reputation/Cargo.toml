[package]
name = "skillxchange-reputation"
version = "0.1.0"
edition = "2021"
description = "On-chain reputation and review scoring contract for SkillXchange"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
