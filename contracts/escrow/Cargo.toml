[package]
name = "skillxchange-escrow"
version = "0.1.0"
edition = "2021"
description = "Soroban escrow smart contract for SkillXchange session payments"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
